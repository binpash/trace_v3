[package]
name = "trace_v3"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.39", features = ["derive"] }
libbpf-rs = { version = "0.24.8", features = ["generate-test-files", "libbpf-sys", "vendored"] }
libbpf-sys = "1.5.0"
libc = "0.2.172"
nix = {version = "0.30.1", features = ["user"]}
num_cpus = "1.17.0"
once_cell = "1.21.3"
plain = "0.2.3"
syscallnrs = "0.1.2"

[build-dependencies]
bindgen = "0.72.0"
libbpf-cargo = "0.24.8"
